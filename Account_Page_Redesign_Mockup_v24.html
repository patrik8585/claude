<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Page Redesign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#18202E; --muted:#5E6878; --faint:#98A1AF;
  --line:#DCE1E8; --accent:#1F3A68; --accent-ink:#FFFFFF; --accent-soft:#E4EAF4; --link:#2556A8;
  --bad:#B83229; --bad-soft:#FBE9E7; --good:#237A4B; --good-soft:#E3F2E8; --warn:#9A6400; --warn-soft:#FBF1DC;
  --new:#6B4FB8; --new-soft:#EEE9FA; --rail:#FFFFFF; --rail-ink:#7C8696;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F141C; --surface:#18202B; --surface-2:#1E2734; --ink:#E6EAF0; --muted:#A3ADBB; --faint:#6D7786;
  --line:#2C3644; --accent:#8FB0E6; --accent-ink:#0F1726; --accent-soft:#233149; --link:#8FB5F0;
  --bad:#F08A80; --bad-soft:#3A2224; --good:#7CCB9C; --good-soft:#1C3326; --warn:#E6B45C; --warn-soft:#352B18;
  --new:#B7A3F0; --new-soft:#2A2340; --rail:#18202B; --rail-ink:#8595B0;}}
:root[data-theme="dark"]{
  --ground:#0F141C; --surface:#18202B; --surface-2:#1E2734; --ink:#E6EAF0; --muted:#A3ADBB; --faint:#6D7786;
  --line:#2C3644; --accent:#8FB0E6; --accent-ink:#0F1726; --accent-soft:#233149; --link:#8FB5F0;
  --bad:#F08A80; --bad-soft:#3A2224; --good:#7CCB9C; --good-soft:#1C3326; --warn:#E6B45C; --warn-soft:#352B18;
  --new:#B7A3F0; --new-soft:#2A2340; --rail:#18202B; --rail-ink:#8595B0;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;padding-inline:16px;padding-block:24px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
.intro h1{font-size:22px;margin:0;font-weight:600;text-wrap:balance}
.intro p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.cfg{display:inline-flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.hl-line{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:4px 20px;padding:0 18px 8px 62px}
.hl-line:last-of-type{padding-bottom:10px}
.hl-line > div{display:grid;min-width:0}
.hl-line .lbl{font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-line .val,.hl-line a,.hl-line button.link{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:left}
.hl-line a{color:var(--link);text-decoration:none;font-weight:500}
@media (max-width:640px){.hl-line{padding-left:18px;--cols:2!important}}
.calldet{margin-top:6px}
.calldet summary{cursor:pointer;color:var(--link);font-size:12.5px}
.calldet .dl{margin:8px 0 2px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.calldet dd.note{white-space:normal;max-width:60ch}
.sample{font-size:12px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* device */
.device{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px -18px rgba(20,30,50,.35);display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr;height:980px}
@media (max-width:640px){.device{height:800px;grid-template-columns:minmax(0,1fr)}}
.appbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;overflow:hidden}
.appbar .brand{font-weight:700;color:var(--accent);letter-spacing:.02em;text-transform:none;font-size:16px;margin-right:auto}
.appbar span{white-space:nowrap}
.appbar .pillbtn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 11px;font-weight:600}
@media (max-width:760px){.appbar .x{display:none}}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:18px;color:var(--rail-ink);font-size:15px}
.rail .on{color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 6px}
@media (max-width:640px){.rail{display:none}}
.scroller{overflow-y:auto;background:var(--ground);position:relative;min-width:0}

/* highlight panel: 2 lines */
.hl{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.hl-main{display:flex;align-items:center;gap:12px;padding:10px 18px}
.back{border:0;background:none;color:var(--link);padding:4px 2px 4px 0;font-size:14px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.who{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .name{font-size:17px;font-weight:600}
.who .sub{color:var(--muted);font-size:13.5px}
.who .sub a{color:var(--link);text-decoration:none}
.actions{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:500;border:1px solid transparent;background:var(--surface-2);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
button.chip:hover{border-color:currentColor}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--link)}
.split{display:inline-flex}
.split .btn:first-child{border-radius:8px 0 0 8px}
.split .btn+.btn{border-radius:0 8px 8px 0;border-left:1px solid rgba(255,255,255,.35);padding-inline:9px}
@media (max-width:760px){.who .sub{display:none}.chip .t{display:none}}
.hl-meta{display:flex;gap:6px 30px;padding:0 18px 10px 62px;overflow-x:auto;white-space:nowrap}
.hl-meta > div{display:flex;gap:6px;align-items:baseline}
@media (max-width:640px){.hl-meta{padding-left:18px}}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hl-meta .lbl{font-size:10.5px}
.val{font-size:13.5px;overflow-wrap:anywhere}
.val.empty{color:var(--faint)}
button.link{color:var(--link);background:none;border:0;padding:0;font-size:13.5px}
.tabs{display:flex;gap:4px;padding:0 18px;border-top:1px solid var(--line);background:var(--surface);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.newtag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--new);background:var(--new-soft);border-radius:4px;padding:1px 5px}
.anchors{display:flex;flex-wrap:wrap;gap:6px;padding:8px 18px;background:var(--surface-2);border-top:1px solid var(--line)}
.anchors button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.anchors button:hover{color:var(--ink)}

/* popovers */
.pop{position:absolute;top:52px;width:min(380px,calc(100% - 36px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,.35);padding:14px;z-index:10;right:18px}
.pop h4{margin:0 0 8px;font-size:14px}
.pop p{margin:0 0 10px;color:var(--muted);font-size:13px}
.menu{padding:6px;width:220px}
.menu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;gap:10px;align-items:center;font-size:13.5px}
.menu button:hover{background:var(--surface-2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px;margin:0 0 10px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.ep{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0;font-variant-numeric:tabular-nums}
.ep th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:right;padding:4px 0 6px}
.ep th:first-child,.ep td:first-child{text-align:left}
.ep td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
.ep tr.tot td{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--good)}
.bar b{position:absolute;top:0;bottom:0;background:var(--good);opacity:.35}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin:2px 0 4px}
.legend span::before{content:"";display:inline-block;width:10px;height:6px;border-radius:2px;background:var(--good);margin-right:5px;vertical-align:middle}
.legend span.pl::before{opacity:.35}

.panel{padding:16px 18px 40px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;scroll-margin-top:calc(var(--hlh,150px) + 10px)}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:600;margin-right:auto}
.card-b{padding:12px 14px}
.emptytxt{color:var(--faint);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv .val{margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tile{background:var(--surface-2);border-radius:8px;padding:10px}
.warnline{color:var(--warn);font-size:13px;font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--link);font-size:13px}

/* timeline */
.tl-wrap{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
@media (max-width:760px){.tl-wrap{grid-template-columns:1fr}}
.filters{position:sticky;top:calc(var(--hlh,150px) + 12px)}
.filters label{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.filters label:first-of-type{border-top:0}
.ticon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.t-call{background:#E1ECFA;color:#2556A8}.t-f2f{background:#E3F2E8;color:#237A4B}.t-email{background:#FBF1DC;color:#9A6400}.t-pres{background:#EEE9FA;color:#6B4FB8}.t-sample{background:#FBE9E7;color:#B83229}
.tlbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tlbar .lbl{text-transform:none;letter-spacing:0;font-size:12.5px}
select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--ink)}
.months{display:grid;gap:10px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.month-h{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border:0;background:none;text-align:left;flex-wrap:wrap}
.month-h .m{font-weight:600;min-width:100px}
.month-h .caret{color:var(--muted);transition:transform .15s}
.month.open .caret{transform:rotate(90deg)}
.counts{display:flex;gap:12px;flex-wrap:wrap}
.counts span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.counts .ticon{width:22px;height:22px;font-size:9px}
.items{list-style:none;margin:0;padding:12px 14px;border-top:1px solid var(--line);display:none;gap:10px}
.month.open .items{display:grid}
.items li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start}
.tmeta{color:var(--muted);font-size:12px;margin-top:2px}
.nomonth{color:var(--faint);font-size:13px;padding:2px 14px}
.you{font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;margin-left:4px;font-weight:600}

/* details */
.md{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:720px}
@media (max-width:760px){.md{grid-template-columns:1fr}}
.side{position:sticky;top:var(--hlh,150px);max-height:calc(980px - var(--hlh,150px) - 60px);overflow-y:auto;border-right:1px solid var(--line);background:var(--surface-2);border-radius:10px 0 0 10px;padding:6px 0}
@media (max-width:760px){.side{position:static;max-height:240px;border-right:0;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}}
.side h5{margin:10px 14px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:500}
.side button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 14px;font-size:13px;color:var(--ink);border-left:3px solid transparent}
.side button:hover{background:var(--surface)}
.side button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;border-left-color:var(--accent)}
.side .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
.side button.zero{color:var(--faint)}
.main{min-width:0;padding:14px 18px 30px}
.dtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:var(--hlh,150px);background:var(--surface);padding:8px 0;z-index:2}
.search{flex:1 1 220px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sec{border-top:1px solid var(--line);padding-top:6px;margin-top:10px;scroll-margin-top:calc(var(--hlh,150px) + 60px)}
.sec:first-of-type{border-top:0;margin-top:0}
.sec-h{display:flex;align-items:center;gap:8px;padding:6px 0}
.sec-h h3{margin:0;font-size:14.5px;color:var(--accent);margin-right:auto;font-weight:600}
.sec.editing{background:var(--surface-2);border-radius:8px;padding:6px 12px 12px;box-shadow:0 0 0 2px var(--link) inset}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
@media (max-width:900px){.rows{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:minmax(120px,44%) 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.row .l{color:var(--muted);font-size:13px}
.row .v{font-size:13.5px;overflow-wrap:anywhere}
.row .v.empty{color:var(--faint)}
.row .v a{color:var(--link);text-decoration:none}
.row.hide{display:none}
.row input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.editing .row.ro .v{color:var(--faint)}
.mono{font-family:var(--mono);font-size:12.5px}
mark{background:var(--warn-soft);color:inherit;border-radius:2px}
.noresult{color:var(--faint);padding:20px 0}
.rl-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rl-h h3{margin:0;font-size:17px;margin-right:auto}
.rl-h h3 span{color:var(--faint);font-weight:400}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.rt{width:100%;border-collapse:collapse;font-size:13.5px}
.rt th,.rt td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt th{font-size:11.5px;color:var(--link);font-weight:600;background:var(--surface-2);cursor:pointer;user-select:none}
.rt th[aria-sort]::after{content:" ▲";font-size:9px}
.rt th[aria-sort="descending"]::after{content:" ▼"}
.rt tbody tr:nth-child(even){background:var(--surface-2)}
.rt tbody tr:last-child td{border-bottom:0}

/* insight cards (OCE-style) */
.subtabs{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:12.5px;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.isec{margin-bottom:16px}
.isec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.isec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-height:132px}
.icard .top{display:flex;align-items:start;gap:6px;font-size:12px;color:var(--muted)}
.icard .top .nm{font-weight:600;color:var(--ink);font-size:12.5px}
.icard .pencil{border:0;background:none;color:var(--link);padding:0 2px;font-size:12px;margin-left:auto}
.icard .body{display:grid;place-items:center;text-align:center}
.icard .foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);align-items:center}
.icard .foot button{border:0;background:none;color:var(--link);font-size:10.5px;padding:0}
.big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.chg{font-size:11px;margin-left:6px;font-weight:500}
.chg.up{color:var(--good)}.chg.down{color:var(--bad)}
.txtval{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;display:inline-block;border:0;padding:0}
button.sw{cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--good)}.sw.on i{left:21px}
.dots{display:flex;gap:7px;justify-content:center;align-items:center;margin-bottom:8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dotlab{font-size:22px;font-weight:700;line-height:1.1}
.icard .foot.ro{justify-content:flex-start}
.ring2{position:relative;width:86px;height:86px}
.ring2 svg{transform:rotate(-90deg)}
.ring2 .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.pot{font-size:10.5px;color:var(--muted)}
/* consent */
.ctab{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 10px}
.ctab td{padding:6px 0;border-top:1px solid var(--line)}
.ctab tr:first-child td{border-top:0}
.ctab td:last-child{text-align:right}
.st{font-size:12.5px;font-weight:500}
.st.in{color:var(--good)}.st.out{color:var(--bad)}.st.none{color:var(--faint)}
.clist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px 24px}

function insightCard(c){
  const col=c.c||(c.scale&&c.idx!=null?c.scale[c.idx]:'');
  let body='';
  if(c.t==='toggle'){body=c.edit?`<button class="sw ${c.v==='Yes'?'on':''}" type="button" data-toggle="${esc(c.l)}" role="switch" aria-checked="${c.v==='Yes'}" aria-label="${esc(c.l)}"><i></i></button>`:`<span class="sw ${c.v==='Yes'?'on':''}" role="img" aria-label="${esc(c.v)}"><i></i></span>`}
  else if(c.t==='text'){body=`<div class="txtval" style="${col?`color:${col}`:''}">${esc(c.v)}</div>`}
  else if(c.t==='picklist'){body=state.editPick===c.l?`<select class="pick" id="pick-sel" aria-label="${esc(c.l)}">${PICK_OPTS.map(o=>`<option${o===c.v?' selected':''}>${esc(o)}</option>`).join('')}</select>`:`<div class="txtval" style="${col?`color:${col}`:''}">${esc(c.v)}</div>`}
  else if(c.t==='date'){body=`<div class="txtval" style="font-weight:500;${col?`color:${col}`:''}">${esc(c.v)}</div>`}
  else if(c.t==='number'){body=`<div class="big" style="${col?`color:${col}`:''}">${esc(c.v)}</div>`}
  else if(c.t==='continuum'){
    body=`<div><div class="dots">${c.steps.map((_,i)=>`<i style="${i<=c.idx?`background:${c.scale[i]};border-color:${c.scale[i]}`:''}" title="${esc(c.steps[i])}"></i>`).join('')}</div><div class="dotlab" style="color:${col}">${esc(c.v)}</div></div>`}
  else if(c.t==='doughnut'||c.t==='doughnut%'){
    const num=parseFloat(c.v)||0, pct=Math.max(0,Math.min(1,num/c.max)), C=2*Math.PI*34;
    body=`<div><div class="ring2"><svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="34" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="43" cy="43" r="34" fill="none" stroke="${c.c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/></svg><span class="mid" style="color:${c.c}">${esc(c.v)}${c.t==='doughnut%'?'%':''}</span></div>${c.pot?`<div class="pot">${esc(c.pot)}</div>`:''}</div>`}
  return `<div class="icard"><div class="top"><span class="nm">${esc(c.l)}</span>${c.edit&&state.editPick!==c.l?`<button class="pencil" type="button" aria-label="Edit"${c.t==='picklist'?` data-pick="${esc(c.l)}"`:''}>✎</button>`:''}</div><div class="body">${body}</div>${state.editPick===c.l?`<div class="foot"><span></span><span class="cellbtns"><button type="button" class="ok" data-pick-save="${esc(c.l)}">Save</button><button type="button" data-pick-cancel="1">Cancel</button></span></div>`:`<div class="foot${c.edit?'':' ro'}"><span>Updated ${esc(c.upd)}</span>${c.edit?`<button type="button"${c.t==='picklist'?` data-pick-clear="${esc(c.l)}"`:''}>Clear</button>`:''}</div>`}</div>`;
}

const PICK_OPTS=['Oncologist_Community','Oncologist_Hospital','Paediatrician','General Practitioner','Dietitian','Pharmacist'];
const LETTERS=['A','B','C','D'], LCOL={A:'#2E7D32',B:'#8AAE24',C:'#E06C1F',D:'#C62828'};
const clCol=v=>v>=4?'#2E7D32':v>=3?'#8AAE24':v>=2?'#E06C1F':'#C62828';
function gridCell(c,r,i){
  const ed=state.editCell===r+'-'+i, at=`data-cell="${r}-${i}"`;
  let inner='';
  if(c.t==='num'){
    inner = ed
      ? `<input class="gin" id="gin-${r}-${i}" type="number" value="${esc(c.v)}" aria-label="Value"><div class="cellbtns"><button type="button" class="ok" data-save="${r}-${i}">Save</button><button type="button" data-cancel="1">Cancel</button></div>`
      : `<span class="num">${esc(c.v)}</span>`;
  } else if(c.t==='cl'){
    const col=clCol(c.v);
    inner = `<div class="pips">${[1,2,3,4,5].map(n=>{const on=n<=c.v;const st=on?`background:${col};border-color:${col}`:'';
      return ed?`<button class="pip" type="button" data-set="${r}-${i}-${n}" style="${st}" aria-label="${n}"></button>`:`<b style="${st}"></b>`}).join('')}</div><span class="num" style="font-size:14px;color:${col}">CL ${c.v}</span>`;
  } else {
    inner = `<div class="chips">${LETTERS.map(L=>{const on=L===c.v;const st=on?`background:${LCOL[L]};border-color:${LCOL[L]};color:#fff`:'';
      return `<b style="${st}">${L}</b>`}).join('')}</div>`;
  }
  return `<div class="cell${ed?' editing':''}" ${at}>${inner}${(c.t==='num'&&ed)||c.t==='letter'?'':`<button class="pencil" type="button" data-edit="${r}-${i}" aria-label="Edit">✎</button>`}</div>`;
}
function segmentGrid(g){
  const used=g.dims.filter((d,i)=>g.rows.some(r=>r.keys[i]));
  const k=v=>v?('0'+v):'1';
  const rows=g.rows.map((r,ri)=>({r,ri})).sort((a,b)=>k(a.r.keys[0]).localeCompare(k(b.r.keys[0]))||k(a.r.keys[1]).localeCompare(k(b.r.keys[1])));
  const head=used.length>1?'Segment':used[0]||'Segment';
  const body=rows.map(({r,ri})=>{
    const ta=r.keys[0], team=r.keys[1];
    const main=ta||team||'—', chip=(ta&&team)?`<span class="teamchip">${esc(team)}</span>`:'';
    return `<tr><td><div class="ta"><div><div class="rowlab">${esc(main)}${chip}</div><div class="rowsub">Updated ${esc(r.upd)}</div></div></div></td>${r.cells.map((c,ci)=>`<td>${gridCell(c,ri,ci)}</td>`).join('')}</tr>`}).join('');
  return `<div class="gwrap"><table class="grid"><colgroup><col class="c1">${g.cols.map(()=>'<col>').join('')}</colgroup>
   <thead><tr><th><div>${esc(head)}</div><div class="hsub">${esc(used.join(' + '))}</div></th>${g.cols.map(c=>`<th><div>${esc(c.t)}</div><div class="hsub">${esc(c.sub||'')}</div></th>`).join('')}</tr></thead>
   <tbody>${body}</tbody></table></div>`;
}

  return `<div class="qsum"><span>${rows.length} affiliations</span><button class="btn sm primary" type="button" data-aff-new="1" style="margin-left:auto"${na?' disabled':''}>+ New affiliation</button></div>
   <div class="tablewrap"><table class="rt"><thead><tr><th>From</th><th>To</th><th>Decision maker</th><th>Relationship type</th>${xc.map(k=>`<th>${esc(k)}</th>`).join('')}<th></th></tr></thead><tbody>${nr}${tr}</tbody></table></div>
   <p class="sample">Example affiliations. From and To are always both filled and can each be an HCP or an HCO. Which columns are editable, and on which affiliations (None / Soft / All), is set in the custom metadata, not in the app. Default: From and To editable on Soft only (locked on Hard), Decision maker (${DM_OPTS.join(' / ')}) editable on Hard and Soft, Relationship type read-only. Use the switch above the device to see From/To switched to read-only. New affiliations are created as Soft. The first four columns are always shown; extra columns after Relationship type come from custom metadata per CBU and Team (switch CBU/Team above the device to compare).</p>`;
}
function renderQuest(d){
  const f=state.qf||'All', all=d.quest, open=all.filter(q=>q[1]!=='Answered'), mand=open.filter(q=>q[2]==='Yes');
  const rows=all.filter(q=>f==='All'||(f==='Open'?q[1]!=='Answered':q[1]==='Answered'));
  return `<div class="qsum"><span><b>${all.length-open.length}</b> of ${all.length} answered</span><span class="${mand.length?'warn':''}"><b>${mand.length}</b> mandatory open</span>
   <div class="seg" id="qSeg">${['All','Open','Answered'].map(x=>`<button type="button" data-qf="${x}" aria-pressed="${x===f}">${x}</button>`).join('')}</div></div>
   <div class="tablewrap"><table class="rt"><thead><tr><th>Questionnaire</th><th>Status</th><th>Mandatory</th><th>Assigned / answered</th><th></th></tr></thead><tbody>${rows.map(q=>`<tr><td>${esc(q[0])}</td><td>${pill(q[1],q[1]==='Answered'?'ok':'open')}</td><td>${q[2]==='Yes'?pill('Mandatory','mand'):'<span class="faint">Optional</span>'}</td><td>${esc(q[3])}</td><td style="text-align:right">${q[1]==='Answered'?'<button class="btn sm ghost" type="button">View answers</button>':'<button class="btn sm primary" type="button">▶ Start</button>'}</td></tr>`).join('')||'<tr><td colspan="5" class="faint">No questionnaires</td></tr>'}</tbody></table></div>
   <p class="sample">Example questionnaires assigned to this account. Start opens the questionnaire to fill in; View answers opens the answered one.</p>`;
}
function renderSamp(d){
  const y=new Date().getFullYear();
  return `<div class="qsum"><span>Annual sample limits · <b>${y}</b> (current year)</span></div>
   <div class="tablewrap"><table class="rt"><thead><tr><th>Product</th><th>Annual limit ${y}</th><th>Delivered ${y}</th><th>Remaining ${y}</th></tr></thead><tbody>${d.samp.map(([n,lim,used])=>{const rem=lim-used,col=rem===0?'var(--bad)':rem/lim<=.2?'#E06C1F':'var(--good)';
    return `<tr><td>${esc(n)}</td><td>${lim}</td><td>${used}</td><td style="color:${col};font-weight:600">${rem}${rem===0?' · limit reached':''}</td></tr>`}).join('')}</tbody></table></div>
   <p class="sample">Example sample limits per product. Limits are annual: quantities count for the current year (${y}) only and start again from 0 each year. Delivered = quantity already used or delivered.</p>`;
}
function openCal(d){
  $('#calModal')?.remove();
  const today=new Date();today.setHours(0,0,0,0);
  let view=new Date(today.getFullYear(),today.getMonth(),1),sel=null,slot=null;
  const mark=[3,10,17].map(n=>new Date(today.getFullYear(),today.getMonth(),today.getDate()+n).toDateString());
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='calModal';document.body.appendChild(bg);
  const key=x=>x.toDateString();
  const draw=()=>{
    const first=(view.getDay()+6)%7,dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    let cells='';for(let i=0;i<first;i++)cells+='<i></i>';
    for(let n=1;n<=dim;n++){const dt=new Date(view.getFullYear(),view.getMonth(),n),past=dt<today;
      cells+=`<button type="button" class="cd${key(dt)===key(today)?' today':''}${sel&&key(dt)===key(sel)?' sel':''}${mark.includes(key(dt))?' has':''}" data-d="${n}"${past?' disabled':''}>${n}</button>`}
    bg.innerHTML=`<div class="modal" role="dialog" aria-label="Plan a call"><div class="mh"><h3>Plan a call · ${esc(d.name)}</h3><button type="button" class="x" data-x="1" aria-label="Close">✕</button></div>
     <div class="calbody"><div><div class="calnav"><button type="button" data-m="-1" aria-label="Previous month">‹</button><b>${view.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button type="button" data-m="1" aria-label="Next month">›</button></div>
      <div class="calgrid">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<span class="dow">${x}</span>`).join('')}${cells}</div><p class="sample">Dot = day with calls already planned in your calendar.</p></div>
      <div class="slots"><h4>${sel?sel.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}):'Select a day'}</h4>${sel?['09:00','10:30','13:00','14:30','16:00'].map(t=>`<button type="button" class="slot${slot===t?' sel':''}" data-s="${t}">${t}</button>`).join(''):'<p class="sample">Pick a day to see free slots.</p>'}</div></div>
     <div class="mf"><button class="btn" type="button" data-x="1">Cancel</button><button class="btn primary" type="button" data-ok="1"${sel&&slot?'':' disabled'}>Plan call</button></div></div>`;};
  bg.addEventListener('click',e=>{const t=e.target;if(t===bg||t.closest('[data-x]')||t.closest('[data-ok]')){bg.remove();return}
    const m=t.closest('[data-m]');if(m){view=new Date(view.getFullYear(),view.getMonth()+ +m.dataset.m,1);draw();return}
    const dd=t.closest('[data-d]');if(dd){sel=new Date(view.getFullYear(),view.getMonth(),+dd.dataset.d);slot=null;draw();return}
    const sl=t.closest('[data-s]');if(sl){slot=sl.dataset.s;draw()}});
  draw();
}
function renderRatings(d){
  const conf=cfg(d.insight)||{};
  const groups=Object.keys(conf);
  const all=[...groups,...FIXED_SUB];
  const cur=all.includes(state.isub)?state.isub:all[0];
  if(FIXED_SUB.includes(cur))return subtabBar(all,cur)+`<div class="isec"><h4>${esc(cur)}</h4>${({Affiliation:renderAff,Questionnaire:renderQuest,Sample:renderSamp})[cur](d)}</div>`;
  const sec=conf[cur], grid=Array.isArray(sec)?null:sec.grid, cards=Array.isArray(sec)?sec:(sec.cards||[]);
  return subtabBar(all,cur)+
   `<div class="isec"><h4>${esc(cur)}</h4>${grid?segmentGrid(grid):''}${cards.length?`<div class="icards"${grid?' style="margin-top:10px"':''}>${cards.map(insightCard).join('')}</div>`:''}</div>`+
   `<p class="sample">Example cards. Display type, colour scale and thresholds come from custom metadata (see CR section 10.2). Each row is one segment record. The first column shows what the CBU segments by – therapeutic area, team, or both (team as a chip). Switch CBU/Team above the device to compare. Sub-tabs: General and Segment come from custom metadata; Affiliation, Questionnaire and Sample are always shown.</p>`;
}


/* ------------ behaviour ------------ */
function bind(d){
  const hl=$('#hl');
  scroller.style.setProperty('--hlh',hl.offsetHeight+'px');
  $$('.tab').forEach(t=>t.addEventListener('click',()=>{state.tab=t.dataset.tab;render();scroller.scrollTop=0}));
  $$('[data-tabgo]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tabgo;render();scroller.scrollTop=0}));
  $$('[data-go]').forEach(b=>b.addEventListener('click',()=>{const el=$('#'+b.dataset.go);scroller.scrollTo({top:el.offsetTop-hl.offsetHeight-10,behavior:'smooth'})}));
  $$('[data-link]').forEach(a=>{if(a.dataset.link==='0'||a.dataset.link==='1')return;a.addEventListener('click',e=>{e.preventDefault();const t=a.dataset.link;if(t==='contacts'){state.tab='con';render()}else if(t==='hco'||t==='hcp'){go(t)}})});
  $$('[data-pop]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const p=$('#'+b.dataset.pop);const was=p.hidden;$$('.pop').forEach(x=>x.hidden=true);if(b.closest('.panel'))scroller.scrollTo({top:0});p.hidden=!was;b.setAttribute('aria-expanded',!p.hidden)}));
  $$('.pop').forEach(p=>p.addEventListener('click',e=>e.stopPropagation()));
  // engagement plan
  const renderEP=w=>{const f=x=>w?(Math.round(x*10)/10).toLocaleString('en-GB'):x;let G=0,A=0,Pl=0;
    const rows=d.ep.map(([c,g,a,pl,wt])=>{const k=w?wt:1;G+=g*k;A+=a*k;Pl+=pl*k;return `<tr><td>${c}${w?` <span class="sample">×${wt}</span>`:''}</td><td>${f(g*k)}</td><td>${f(a*k)}</td><td>${f(pl*k)}</td></tr><tr><td colspan="4" style="border:0;padding:0 0 6px"><div class="bar"><i style="width:${a/g*100}%"></i><b style="left:${a/g*100}%;width:${pl/g*100}%"></b></div></td></tr>`}).join('');
    $('#epTable').innerHTML=`<table class="ep"><thead><tr><th>Channel</th><th>Goal</th><th>Actual</th><th>Planned</th></tr></thead><tbody>${rows}<tr class="tot"><td>Total${w?' (CEQ)':''}</td><td>${f(G)}</td><td>${f(A)}</td><td>${f(Pl)}</td></tr></tbody></table>`;
    $('#ceqNote').textContent=w?'CEQ: touchpoints × the weight of each channel':'Touchpoints: number of interactions per channel';};
  renderEP(0);
  $('#ceqSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#ceqSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderEP(+b.dataset.w)});
  const gridOf=()=>{const conf=cfg(d.insight)||{};const sec=conf[state.isub];return (sec&&!Array.isArray(sec))?sec.grid:null};
  $$('[data-edit]').forEach(b=>b.addEventListener('click',()=>{state.editCell=b.dataset.edit;render();const inp=$('#gin-'+state.editCell);if(inp){inp.focus();inp.select()}}));
  $$('[data-cancel]').forEach(b=>b.addEventListener('click',()=>{state.editCell=null;render()}));
  $$('[data-save]').forEach(b=>b.addEventListener('click',()=>{const [r,i]=b.dataset.save.split('-').map(Number);const g=gridOf();const inp=$('#gin-'+r+'-'+i);
    if(g&&inp){g.rows[r].cells[i].v=inp.value.trim()||'0';g.rows[r].upd='just now'}state.editCell=null;render()}));
  $$('[data-set]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.set.split('-');const r=+p[0],i=+p[1],v=p[2];const g=gridOf();
    if(g){g.rows[r].cells[i].v=isNaN(+v)?v:+v;g.rows[r].upd='just now'}state.editCell=null;render()}));
  $$('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-checked')==='true';b.setAttribute('aria-checked',!on);b.classList.toggle('on',!on);const c=findCard(d,b.dataset.toggle);if(c)c.v=on?'No':'Yes'}));
  $$('[data-aff-new]').forEach(b=>b.addEventListener('click',()=>{state.newAff=true;state.editAff=null;state.editDM=null;render()}));
  $$('[data-dm-edit]').forEach(b=>b.addEventListener('click',()=>{state.editDM=+b.dataset.dmEdit;state.editAff=null;state.newAff=false;render()}));
  $$('[data-dm-cancel]').forEach(b=>b.addEventListener('click',()=>{state.editDM=null;render()}));
  $$('[data-dm-save]').forEach(b=>b.addEventListener('click',()=>{d.aff.rows[+b.dataset.dmSave][4]=dmRead('aff-dm');state.editDM=null;render()}));
  $$('[data-aff-edit]').forEach(b=>b.addEventListener('click',()=>{state.editAff=+b.dataset.affEdit;state.editDM=null;state.newAff=false;render()}));
  $$('[data-aff-cancel]').forEach(b=>b.addEventListener('click',()=>{state.editAff=null;state.newAff=false;render()}));
  const affRead=r=>{const f=$('#aff-from')?$('#aff-from').value:r[1]+'|'+r[0],t=$('#aff-to')?$('#aff-to').value:r[3]+'|'+r[2];return(f&&t&&f!==t)?[f.split('|'),t.split('|')]:null};
  ['#aff-from','#aff-to'].forEach(q=>$(q)?.addEventListener('change',()=>{const ad=$('#aff-add');if(ad)ad.disabled=!affRead()}));
  if($('#aff-add'))$('#aff-add').disabled=true;
  $$('[data-aff-add]').forEach(b=>b.addEventListener('click',()=>{const v=affRead();if(!v)return;d.aff.rows.unshift([v[0][1],v[0][0],v[1][1],v[1][0],dmRead('aff-dm'),'Soft',{}]);state.newAff=false;render()}));
  $$('[data-aff-save]').forEach(b=>b.addEventListener('click',()=>{const r=d.aff.rows[+b.dataset.affSave];const v=affRead(r);if(!v)return;[r[0],r[1],r[2],r[3]]=[v[0][1],v[0][0],v[1][1],v[1][0]];state.editAff=null;render()}));
  $$('[data-plan]').forEach(b=>b.addEventListener('click',()=>{$$('.pop').forEach(x=>x.hidden=true);openCal(d)}));
  $$('[data-qf]').forEach(b=>b.addEventListener('click',()=>{state.qf=b.dataset.qf;render()}));
  $$('[data-pick]').forEach(b=>b.addEventListener('click',()=>{state.editPick=b.dataset.pick;render();$('#pick-sel')?.focus()}));
  $$('[data-pick-cancel]').forEach(b=>b.addEventListener('click',()=>{state.editPick=null;render()}));
  $$('[data-pick-save]').forEach(b=>b.addEventListener('click',()=>{const c=findCard(d,b.dataset.pickSave);if(c){c.v=$('#pick-sel').value;c.upd='just now'}state.editPick=null;render()}));
  $$('[data-pick-clear]').forEach(b=>b.addEventListener('click',()=>{const c=findCard(d,b.dataset.pickClear);if(c){c.v='—';c.upd='just now'}render()}));
  $$('[data-isub]').forEach(b=>b.addEventListener('click',()=>{state.isub=b.dataset.isub;state.editCell=null;state.editPick=null;state.editAff=null;state.editDM=null;state.newAff=false;render()}));
  $$('[data-rel-name]').forEach(b=>b.addEventListener('click',()=>{const i=d.related.findIndex(r=>r[0]===b.dataset.relName);state.tab='det';render();openRel(d,i)}));
  // contacts / affiliated search
  $('#conSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$$('#conBody tr').forEach(r=>r.hidden=!r.dataset.q.includes(q))});
  $('#affSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$$('#affList li').forEach(r=>r.hidden=!r.dataset.q.includes(q))});
  // timeline
  if($('#months')){drawTL(d);
    $('#periodSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#periodSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawTL(d)});
    ['#taSel','#hcpSel'].forEach(s=>$(s)?.addEventListener('change',()=>drawTL(d)));
    $('#tlFilters').addEventListener('change',()=>drawTL(d));}
  // details
  if($('#side')){
    $('#side').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#side button').forEach(x=>x.setAttribute('aria-current',x===b));
      if(b.dataset.rel!=null){openRel(d,+b.dataset.rel);return}
      $('#fieldsView').hidden=false;$('#relView').hidden=true;const el=$('#s'+b.dataset.sec);scroller.scrollTo({top:el.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-hl.offsetHeight-60,behavior:'smooth'})});
    $$('.sec').forEach(sec=>{
      const [eb,cb,sb]=['.edit','.cancel','.save'].map(s=>sec.querySelector(s));
      const mode=(on,save)=>{sec.classList.toggle('editing',on);eb.hidden=on;cb.hidden=sb.hidden=!on;
        sec.querySelectorAll('.row:not(.ro)').forEach(r=>{const val=r.querySelector('.v');
          if(on){r.dataset.orig=val.textContent==='—'?'':val.textContent;val.hidden=true;const inp=document.createElement('input');inp.id=sec.id+'-'+r.dataset.label.replace(/\W+/g,'-');inp.value=r.dataset.orig;r.appendChild(inp)}
          else{const inp=r.querySelector('input');const v=save?inp.value.trim():r.dataset.orig;inp.remove();val.hidden=false;val.textContent=v||'—';val.classList.toggle('empty',!v);r.dataset.empty=v?0:1}});
        applyFilter()};
      eb.addEventListener('click',()=>mode(true));cb.addEventListener('click',()=>mode(false,false));sb.addEventListener('click',()=>mode(false,true));
    });
    $('#fsearch').addEventListener('input',applyFilter);$('#hideEmpty').addEventListener('change',applyFilter);
  }
}
function hi(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function applyFilter(){
  const q=$('#fsearch').value.trim().toLowerCase(),he=$('#hideEmpty').checked;let total=0;
  $$('.sec').forEach(sec=>{let any=0;const ed=sec.classList.contains('editing');
    sec.querySelectorAll('.row').forEach(r=>{const l=r.querySelector('.l'),v=r.querySelector('.v'),label=r.dataset.label,value=v.textContent==='—'?'':v.textContent;
      const hide=(q&&!label.toLowerCase().includes(q)&&!value.toLowerCase().includes(q))||(he&&r.dataset.empty==='1'&&!ed);
      r.classList.toggle('hide',hide);if(!hide)any++;l.innerHTML=hi(label,q);
      if(!v.hidden)v.innerHTML=value?(v.dataset.link==='1'?`<a href="#">${hi(value,q)}</a>`:hi(value,q)):'—'});
    sec.hidden=!any;total+=any});
  $('#noresult').hidden=total>0;
}
function openRel(d,i){
  const [name,cols,rows]=d.related[i];$$('#side button').forEach(x=>x.setAttribute('aria-current',x.dataset.rel==i));
  $('#fieldsView').hidden=true;const v=$('#relView');v.hidden=false;
  v.innerHTML=`<div class="rl-h"><h3>${esc(name)} <span>(${rows.length})</span></h3><button class="btn sm" type="button">+ New</button></div>`+(rows.length?`<div class="tablewrap"><table class="rt"><thead><tr>${cols.map((c,j)=>`<th data-i="${j}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="sample">Example rows. Tap a column header to sort.</p>`:'<p class="emptytxt">No records</p>');
  const tb=v.querySelector('tbody');
  v.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const j=+th.dataset.i,dir=th.getAttribute('aria-sort')==='ascending'?'descending':'ascending';v.querySelectorAll('th').forEach(x=>x.removeAttribute('aria-sort'));th.setAttribute('aria-sort',dir);[...tb.rows].sort((a,b)=>a.cells[j].textContent.localeCompare(b.cells[j].textContent,undefined,{numeric:true})*(dir==='ascending'?1:-1)).forEach(r=>tb.appendChild(r))}));
  scroller.scrollTo({top:0});
}
function go(page){state.page=page;state.tab=null;state.open=new Set();state.openInit=false;$$('#pageSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page));render();scroller.scrollTop=0;try{localStorage.setItem('acct-page',page)}catch(e){}}

document.addEventListener('click',()=>$$('.pop').forEach(p=>p.hidden=true));
$('#pageSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.page)});
$('#hdrCbu').addEventListener('change',e=>{state.cbu=e.target.value;render()});
$('#affFT').addEventListener('change',e=>{AFFEDIT.from=AFFEDIT.to=e.target.value;state.editAff=null;render()});
$('#hdrTeam').addEventListener('change',e=>{state.team=e.target.value;render()});
$('#navToggle').addEventListener('click',e=>{const n=$('#nav');n.classList.toggle('open');e.currentTarget.textContent=n.classList.contains('open')?'‹':'›'});
new ResizeObserver(()=>{const h=$('#hl');if(h)scroller.style.setProperty('--hlh',h.offsetHeight+'px')}).observe(scroller);
let start='hcp';try{start=localStorage.getItem('acct-page')||'hcp'}catch(e){}
go(P[start]?start:'hcp');
})();
</script>
