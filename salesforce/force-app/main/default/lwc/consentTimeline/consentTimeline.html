<template>
    <div class="dcard">
        <h3>
            <span>Gigya synchronisation</span>
            <template lwc:if={data}>
                <template lwc:if={data.canSimulate}>
                    <button type="button" class="btn sm" onclick={simulate} disabled={busy}>Simulate sync (demo)</button>
                </template>
            </template>
        </h3>
        <div class="cb">
            <template lwc:if={error}>
                <div class="alert err">{error}</div>
            </template>
            <template lwc:if={data}>
                <div class={bannerClass}>{bannerText}</div>
                <ul class="tl">
                    <template for:each={steps} for:item="s">
                        <li key={s.key} class={s.state}>
                            <span class="dot">{s.icon}</span>
                            <div><b>{s.title}</b><small>{s.detail}</small></div>
                        </li>
                    </template>
                </ul>
                <div class="alert info">No new integration: the consent record is the same object Pitcher creates today, so the existing connector forwards it to Gigya.</div>
                <dl class="fl">
                    <dt>Capture</dt>
                    <dd><template lwc:if={captureUrl}><a href={captureUrl}>{data.captureName}</a></template></dd>
                    <dt>Follow-up task</dt>
                    <dd>{taskLabel}</dd>
                </dl>
                <div class="evidence">
                    <button type="button" class="btn" onclick={verify} disabled={busy}>Verify evidence</button>
                    <template lwc:if={evidence}>
                        <div class={evidenceClass}>{evidence.message}</div>
                    </template>
                </div>
                <template lwc:if={data.canWithdraw}>
                    <button type="button" class="btn danger" onclick={withdraw} disabled={busy}>Withdraw consent</button>
                </template>
            </template>
        </div>
    </div>
</template>
