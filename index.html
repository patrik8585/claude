<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCP Consent Capture – Clickable Mockup</title>
<style>
:root{
  --brand:#0176d3;--brand-d:#014486;--navy:#032d60;--ink:#181818;--ink2:#444;--mute:#706e6b;
  --line:#dddbda;--bg:#f3f3f3;--card:#fff;--ok:#2e844a;--ok-bg:#e3f3df;--warn:#8c4b02;--warn-bg:#ffefd1;--warn-line:#fe9339;
  --err:#ba0517;--err-bg:#feded8;--ai:#7526e3;--ai-bg:#f3ecfd;--info-bg:#e5f2fd;--teal:#0b827c;
  --font:"Salesforce Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:#e9eef4;font-size:16px;line-height:1.4}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.2em;flex:none}

/* banner + step navigator */
.banner{background:#fff3b0;color:#5c4400;text-align:center;font-weight:700;padding:7px 12px;font-size:14px;letter-spacing:.2px;border-bottom:1px solid #e6d36b}
.top{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.top-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#a8c6e8}
.ttl{min-width:250px}
.ttl b{font-size:20px}
.ttl span{font-size:16px;color:#d6e6f7;margin-left:6px}
#chips{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid #3b5f8d;background:transparent;color:#cfe0f3;border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#1d4a82;display:inline-grid;place-items:center;font-size:12px;font-weight:700}
.chip:hover{background:#0b3f77}
.chip.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
.chip.on i{background:var(--brand);color:#fff}
.chip.done i{background:var(--ok);color:#fff}
.nb{display:flex;gap:8px}
.bar{height:3px;background:#0b3f77}.bar i{display:block;height:100%;background:#57b4ff;transition:width .3s}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:.25rem;padding:7px 16px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{background:#f3f3f3}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}.btn.brand:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--err);border-color:var(--err)}.btn.danger:hover{background:var(--err-bg)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}.btn.ai:hover{background:#5d1db5}
.btn.ghost{background:transparent;border-color:#3b5f8d;color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.lg{padding:12px 20px;font-size:17px}
.btn.block{width:100%}
.btn.sm{padding:4px 10px;font-size:13px}

/* stage + story */
main{max-width:1360px;margin:0 auto;padding:18px 16px 60px}
.story{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:.5rem;padding:14px 18px;margin-bottom:20px}
.who{background:var(--info-bg);color:var(--brand-d);font-weight:700;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.st-main{flex:1;min-width:280px}
.st-main h2{margin:0 0 3px;font-size:22px}
.st-main p{margin:0;color:var(--ink2);font-size:16px}
.solves{display:flex;gap:6px;flex-wrap:wrap;max-width:420px}
.pill{background:var(--ok-bg);color:#194e1c;border:1px solid #b4dcae;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
.pill b{background:var(--ok);color:#fff;border-radius:4px;padding:0 5px;margin-right:5px}
.grid3{display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(240px,1fr);gap:28px;align-items:start;justify-content:center}
.grid2{display:grid;grid-template-columns:auto minmax(260px,1fr);gap:28px;align-items:start;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
@media(max-width:1000px){.grid3,.grid2{grid-template-columns:1fr}}
.note{background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:16px 18px}
.note h4{margin:0 0 8px;font-size:16px}
.note ul{margin:0;padding-left:20px}.note li{margin:6px 0}
.note .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:6px}
.tag.bad{background:var(--err-bg);color:var(--err)}.tag.good{background:var(--ok-bg);color:#194e1c}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:380px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.subtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.demo{font-size:13px;color:var(--mute);text-align:center}
.demo a{color:var(--brand);cursor:pointer;text-decoration:underline}

/* poster / QR */
.poster{background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.poster .hd{background:var(--brand);color:#fff;border-radius:6px;padding:10px;font-weight:700;margin-bottom:12px}
.poster h3{margin:0 0 4px;font-size:20px}.poster p{margin:2px 0 12px;color:var(--ink2)}
.poster svg{width:200px;height:200px;cursor:pointer;border:6px solid #fff;outline:1px solid var(--line)}
.poster .cta{margin-top:10px;font-size:13px;color:var(--mute)}

/* phone */
.phone{width:360px;height:720px;background:#111;border-radius:42px;padding:11px;position:relative;box-shadow:0 14px 34px rgba(0,0,0,.35);flex:none}
.pscreen{background:#fff;border-radius:32px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;padding:9px 22px 3px;font-size:12px;font-weight:700;background:#fff}
.url{margin:2px 12px 6px;background:#f0f0f0;border-radius:8px;padding:5px 10px;font-size:12px;color:#444;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.pbody{flex:1;overflow-y:auto;position:relative;font-size:15px;scrollbar-width:thin}
.pub-h{background:var(--brand);color:#fff;padding:14px 16px}
.pub-h small{display:block;opacity:.85;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.pub-h b{font-size:17px;line-height:1.25;display:block;margin-top:2px}
.pad{padding:14px 16px}
.pbody label.l{display:block;font-size:13px;color:var(--ink2);margin:10px 0 3px}
.pbody label.l i{color:var(--err);font-style:normal}
.in{width:100%;border:1px solid #c9c9c9;border-radius:.25rem;padding:9px 10px;background:#fff;min-height:40px}
.in:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.in.err{border-color:var(--err);background:#fff8f7}
textarea.in{min-height:96px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:13px;line-height:1.35;color:var(--ink2)}
.chk input{width:20px;height:20px;margin-top:1px;flex:none}
.chk.err{color:var(--err)}
.consent{background:#f7f9fb;border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:12px}
.consent .chk{margin:0}
.consent small{display:block;color:var(--mute);margin-top:6px;margin-left:29px}
.prog{height:6px;background:#e5e5e5;border-radius:3px;overflow:hidden;margin:8px 0 2px}.prog i{display:block;height:100%;background:var(--ok);transition:width .25s}
.progt{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.hero-ok{text-align:center;padding:34px 20px}
.big-check{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:44px;animation:pop .4s}
.big-check .ic{width:48px;height:48px}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.hero-ok h3{margin:0 0 8px;font-size:22px}.hero-ok p{color:var(--ink2);margin:6px 0}
.camera{background:linear-gradient(#1b2530,#0c1117);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:18px;text-align:center;padding:20px}
.vf{width:190px;height:190px;border:3px solid #fff;border-radius:18px;position:relative;display:grid;place-items:center;opacity:.9}
.vf:after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#4ade80;animation:scan 1.8s infinite alternate}
@keyframes scan{from{top:10px}to{top:170px}}
.mail-h{background:#f6f6f6;border-bottom:1px solid var(--line);padding:10px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.mail{padding:14px}
.mail .meta{font-size:13px;color:var(--mute);margin-bottom:10px;line-height:1.5}
.mail h4{margin:0 0 10px;font-size:17px}
.mail .box{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}
.mail small{display:block;margin-top:12px;color:var(--mute);font-size:12px}

/* rep app */
.rep-h{background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.rep-h b{font-size:16px}.av{width:30px;height:30px;border-radius:50%;background:#57b4ff;color:var(--navy);display:inline-grid;place-items:center;font-weight:700;font-size:12px}
.tabbar{display:flex;border-top:1px solid var(--line);background:#fff;flex:none}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 12px;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--brand);font-weight:700}.tabbar .ic{width:22px;height:22px}
.evc{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.evc:hover{border-color:var(--brand);box-shadow:0 0 0 2px var(--info-bg)}
.evc b{display:block}.evc small{color:var(--mute)}
.live{background:#e8444a;color:#fff;border-radius:4px;font-size:11px;padding:1px 6px;font-weight:700;margin-left:6px}
.evchip{background:var(--info-bg);color:var(--brand-d);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;gap:6px;align-items:center;margin-bottom:10px}
.srch{position:relative}.srch .ic{position:absolute;left:10px;top:11px;color:var(--mute)}.srch .in{padding-left:34px}
.res{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer;background:#fff}
.res:hover{border-color:var(--brand)}.res small{color:var(--mute);display:block}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute);align-items:center}
.sugg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--brand)}
.hcpcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;background:#fff}
.hcpcard h4{margin:0}.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:10px 0}.kv span:nth-child(odd){color:var(--mute)}
.alert{border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0;display:flex;gap:8px;align-items:flex-start}
.alert.info{background:var(--info-bg);color:var(--brand-d)}.alert.ok{background:var(--ok-bg);color:#194e1c}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.ai{background:var(--ai-bg);color:#4b1a94}
.notes-w{position:relative}
.mic{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mic .ic{width:24px;height:24px}
.mic.on{background:#e8444a;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,68,74,.6)}100%{box-shadow:0 0 0 14px rgba(232,68,74,0)}}
.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:#efe4ff;border-color:var(--ai)}100%{background:#fff}}
.tchip{display:inline-block;background:var(--ai-bg);color:var(--ai);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;margin:2px 3px 2px 0}
.cap{border-bottom:1px solid var(--line);padding:11px 0}
.cap .r{display:flex;justify-content:space-between;gap:8px}.cap small{color:var(--mute)}
.sm-badge{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.sm-badge.ok{background:var(--ok-bg);color:#194e1c}.sm-badge.wait{background:var(--warn-bg);color:var(--warn)}.sm-badge.t{background:var(--ai-bg);color:var(--ai)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9c9c9;border-top-color:var(--brand);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}

/* tablet / kiosk */
.tablet{width:min(940px,100%);aspect-ratio:16/10.5;background:#111;border-radius:30px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.tscreen{background:#fff;border-radius:16px;height:100%;display:grid;grid-template-columns:34% 1fr;overflow:hidden}
.kside{background:linear-gradient(160deg,var(--brand),var(--navy));color:#fff;padding:28px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.kside h3{font-size:26px;margin:0;line-height:1.2}.kside p{margin:0;opacity:.9;font-size:16px}
.kside .kb{background:rgba(255,255,255,.14);border-radius:8px;padding:10px 12px;font-size:14px}
.kmain{padding:20px 26px;overflow:auto}
.kmain .pbody{font-size:16px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.kgrid .full{grid-column:1/-1}
.kmain .in{min-height:46px;font-size:17px}
.kmain label.l{font-size:14px}
.cd{margin-top:16px;color:var(--mute);font-size:15px}
.cd b{color:var(--brand);font-size:20px}
@media(max-width:800px){.tscreen{grid-template-columns:1fr}.kside{display:none}}

/* matching */
.pipe{display:flex;gap:0;align-items:stretch;margin-bottom:16px;flex-wrap:wrap}
.pnode{flex:1;min-width:180px;background:#fff;border:1px solid var(--line);padding:12px 16px;position:relative}
.pnode:not(:last-child){margin-right:16px}
.pnode:not(:last-child):after{content:"";position:absolute;right:-17px;top:50%;margin-top:-10px;border:10px solid transparent;border-left:10px solid var(--brand);border-right:0}
.pnode b{display:block;font-size:15px}.pnode small{color:var(--mute)}
.pnode.act{border-color:var(--brand);box-shadow:0 0 0 2px var(--info-bg)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:10px 14px}
.kpi small{color:var(--mute);display:block;font-size:13px}.kpi b{font-size:28px}
.kpi.g b{color:var(--ok)}.kpi.a b{color:#b86e00}.kpi.b b{color:var(--brand)}
.tw{background:#fff;border:1px solid var(--line);border-radius:.5rem;overflow:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{background:#f3f3f3;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #ecebea;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl small{display:block;color:var(--mute);font-size:12px}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f3f9ff}
.tbl a{color:var(--brand);font-weight:600}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.auto{background:var(--ok-bg);color:#194e1c}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.new{background:#e8e0fa;color:#4b2a9c}
.badge.rev{background:var(--info-bg);color:var(--brand-d)}.badge.dis,.badge.queued{background:#ececec;color:#555}.badge.red{background:var(--err-bg);color:var(--err)}
.rules ol{margin:0;padding-left:20px}.rules li{margin:6px 0}
.rowrun td{background:#f7fbff}
.chan{display:inline-flex;gap:5px;align-items:center;font-size:13px}.chan i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* desktop frame */
.deskwrap{overflow-x:auto;padding-bottom:6px}
.desk{min-width:980px;border:1px solid #b9b9b9;border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:0 14px 34px rgba(0,0,0,.25)}
.chrome{background:#dfe3e8;display:flex;gap:12px;align-items:center;padding:8px 12px}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#b0b6bd;display:block}
.addr{flex:1;background:#fff;border-radius:6px;padding:4px 12px;font-size:12.5px;color:#444;white-space:nowrap;overflow:hidden}
.gh{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px}
.gh .logo{width:34px;height:34px;border-radius:8px;background:#0b5cab;display:grid;place-items:center}.gh .logo .ic{width:22px;height:22px}
.gsearch{flex:1;max-width:520px;margin:0 auto;background:#fff;color:var(--mute);border-radius:4px;padding:6px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
.gicons{display:flex;gap:14px;align-items:center}
.gnav{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 16px;gap:20px;border-top:3px solid var(--brand)}
.gnav .app{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:15px}
.gnav ul{list-style:none;margin:0;padding:0;display:flex}
.gnav li{padding:12px 16px;font-size:14px;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.gnav li:hover{background:#f3f3f3}.gnav li.on{border-bottom-color:var(--brand);font-weight:700;color:var(--ink)}
.dbody{padding:14px 16px 20px;font-size:14px;min-height:560px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:.5rem;box-shadow:0 1px 2px rgba(0,0,0,.08);margin-bottom:12px}
.dcard>h3{margin:0;padding:11px 16px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dcard .cb{padding:12px 16px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ph .oi{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}.ph .oi .ic{width:24px;height:24px}
.ph small{color:var(--mute);display:block;text-transform:uppercase;font-size:11.5px;letter-spacing:.5px}
.ph h1{font-size:20px;margin:0}
.ph .sp{flex:1}
.hl{background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hl .top2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hl .flds{display:flex;gap:30px;margin-top:12px;flex-wrap:wrap}
.hl .flds div small{display:block;color:var(--mute);font-size:12px}.hl .flds div{font-size:14px}
.path{display:flex;list-style:none;margin:0 0 12px;padding:0;background:#fff;border:1px solid var(--line);border-radius:.5rem;overflow:hidden}
.path li{flex:1;text-align:center;padding:9px 6px 9px 18px;font-size:13px;background:#ecebea;color:var(--ink2);position:relative;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);margin-right:-6px}
.path li:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:10px}
.path li.d{background:var(--ok);color:#fff}.path li.c{background:var(--brand);color:#fff;font-weight:700}
.two{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start}
.two.eq{grid-template-columns:1fr 1fr}
.fl{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:14px}
.fl dt{color:var(--mute)}.fl dd{margin:0;word-break:break-word}
.fl2{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}

/* AI extraction (simple pattern-based simulation) */
function aiExtract(t){const out={};const m=t.match(/Dr\.?\s+([A-ZÀ-Ý][\wà-ÿ'’-]+)(?:\s+([A-ZÀ-Ý][\wà-ÿ'’-]+))?/);
  if(m){if(m[2]){out.first=m[1];out.last=m[2]}else out.last=m[1]}
  const e=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(e)out.email=e[0];
  const sp=[['paediatrician','Paediatrics'],['pediatrician','Paediatrics'],['neonatolog','Neonatology'],['gastroenterolog','Paediatric Gastroenterology'],['allergolog','Paediatric Allergy'],['dietitian','Dietetics & Nutrition'],['gynaecolog','Gynaecology']].find(x=>t.toLowerCase().includes(x[0]));if(sp)out.spec=sp[1];
  const city=['Genoa','Milan','Rome','Naples','Turin','Bologna','Florence','Padua','Verona','Bergamo','Brescia'].find(c=>t.includes(c));if(city)out.city=city;
  const o=t.match(/\bat\s+([A-Z][\wà-ÿ]+)/);if(o)out.org=o[1];
  const pr=t.match(/product\s+([A-Z0-9][\w-]*)/i);if(pr)out.interest='Product '+pr[1];
  const mo=['January','February','March','April','May','June','July','August','September','October','November','December'].find(x=>new RegExp('call back in '+x,'i').test(t));
  if(mo)out.task={title:'Call back Dr. '+((out.first?out.first+' ':'')+(out.last||'')),due:mo==='November'?'Mon 2 Nov 2026':'1 '+mo.slice(0,3)+' 2026'};
  return out}

function donut(segs,center){const tot=segs.reduce((a,s)=>a+s.v,0);const R=60,C=2*Math.PI*R;let acc=0;

  return `<div class="donutw"><svg viewBox="0 0 160 160" role="img"><circle r="${R}" cx="80" cy="80" fill="none" stroke="#ececec" stroke-width="26"/>${arcs}<text x="80" y="78" text-anchor="middle" font-size="26" font-weight="700" fill="#181818">${center}</text><text x="80" y="98" text-anchor="middle" font-size="11" fill="#706e6b">of captures</text></svg>
  <div class="dl">${segs.map(s=>`<div><i style="background:${s.c}"></i>${s.l}<b>${s.v} · ${tot?Math.round(s.v/tot*100):0}%</b></div>`).join('')}</div></div>`}

  const conf=cs.filter(c=>c.optIn==='confirmed').length;

   ========================================================= */
const STEPS=[
 {short:'Self-scan',title:'HCP self-scan',who:'HCP · own phone',desc:'The HCP scans the booth QR, fills one short public page and confirms by email (double opt-in).',solves:[2],view:v1},
 {short:'Rep page',title:'Rep captures at the booth',who:'Rep · logged-in phone',desc:'Search first, then add a known HCP or capture a walk-in with voice notes and AI extraction.',solves:[1,3],view:v2},
 {short:'Kiosk',title:'Kiosk mode for training walk-ins',who:'HCP · tablet',desc:'Same public form on a tablet at the entrance. It resets itself after every submission.',solves:[2],view:v3},
 {short:'Matching',title:'Automatic matching',who:'System',desc:'Every capture lands in staging and is matched to existing HCPs in seconds. No Marketing Cloud export.',solves:[3],view:v4},
 {short:'Review',title:'Review console',who:'Data steward · Lightning',desc:'Only ambiguous captures reach a person, with candidates side by side and an AI recommendation.',solves:[3],view:v5},
 {short:'Consent',title:'Consent record',who:'Lightning · record page',desc:'After the match, the consent record is created like Pitcher does today, then sent to Gigya.',solves:[1,3],view:v6},
 {short:'Dashboard',title:'Dashboard',who:'Marketing & Compliance · Lightning',desc:'Channel mix, auto-match rate, consent status and activity per rep, per event.',solves:[1,2,3],view:v7}];

function paint(){const st=STEPS[S.step];
  const keep=document.querySelector('.pbody');const sc=keep?keep.scrollTop:0;const scr=S.step;
  $('#stage').innerHTML=`<section class="story"><span class="who">${st.who}</span><div class="st-main"><h2>${S.step+1}. ${st.title}</h2><p>${st.desc}</p></div><div class="solves">${st.solves.map(p=>`<span class="pill"><b>P${p}</b>${PROB[p]}</span>`).join('')}</div></section>${st.view()}`;
  $('#stepno').textContent=`Step ${S.step+1} of 7`;$('#steptitle').textContent='· '+st.short;
  $('#barfill').style.width=((S.step+1)/7*100)+'%';
  $('#chips').innerHTML=STEPS.map((s,i)=>`<button class="chip ${i===S.step?'on':i<S.step?'done':''}" data-a="go" data-i="${i}"><i>${i<S.step?'✓':i+1}</i><span>${s.short}</span></button>`).join('');
  if(S.wi.flash){S.wi.flash=false}
  const nb=document.querySelector('.pbody');if(nb&&scr===S.step&&S._keepScroll){nb.scrollTop=sc}S._keepScroll=false}
function go(i){i=Math.max(0,Math.min(6,i));clearInterval(S.s3.timer);S.wi.mic=false;clearInterval(S._mic);
  S.step=i;if(i>=4)processAll();
  if(i===3){S.s4.visited=true;paint();if(S.caps.some(c=>!c.processed))setTimeout(runMatching,500)}else paint();
  window.scrollTo({top:0})}

/* =========================================================
   Actions
   ========================================================= */
const A={
 prev:()=>go(S.step-1),next:()=>go(S.step+1),go:t=>go(+t.dataset.i),toast:t=>toast(t.dataset.m),
 fill:t=>{demoFill(t.dataset.p);paint()},
 scan:()=>{S.s1.screen='form';paint()},
 sub1:()=>submitPub('f1'),sub3:()=>submitPub('f3'),
 confirm1:()=>{const c=capOf1();if(c){c.optIn='confirmed'}S.s1.screen='confirmed';paint();toast('Double opt-in confirmed')},
 s1go:t=>{const k=t.dataset.k;if(['thanks','email','confirmed'].includes(k)&&!capOf1()){demoFill('f1');S.f1.consent=true;const f=S.f1;const c=newCap({first:f.first,last:f.last,email:f.email,spec:f.spec,city:f.city,channel:'self',event:'congress',optIn:'pending'});S.s1.cap=c.id;S.f1={slides:true}}
   if(k==='confirmed'){const c=capOf1();if(c)c.optIn='confirmed'}S.s1.screen=k;paint()},
 kreset:()=>{clearInterval(S.s3.timer);S.s3.screen='form';paint()},
 /* rep */
 rev:t=>{S.s2.ev=t.dataset.e;S.s2.screen='capture';S.s2.q='';S.s2.sel=null;paint()},
 rchg:()=>{S.s2.screen='events';paint()},
 rq:t=>{S.s2.q=t.dataset.q;S.s2.sel=null;paint();setTimeout(()=>{const i=$('#rq');if(i)i.focus()},0)},
 rselect:t=>{S.s2.sel=t.dataset.id||null;paint()},
 radd:t=>{const h=hcpById(t.dataset.id);newCap({first:h.first,last:h.last,email:h.email,spec:h.spec,city:h.city,reg:h.reg,channel:'rep',by:REP,event:S.s2.ev,hcpFixed:h.id,optIn:'pending'});S.s2.added[h.id]=1;paint();toast('Added to event – slides + consent link emailed')},
 rwalk:()=>{S.wi={last:S.s2.q.charAt(0).toUpperCase()+S.s2.q.slice(1)};S.s2.screen='walkin';paint()},
 rback:()=>{S.s2.screen='capture';paint()},
 rtab:t=>{S.s2.screen=t.dataset.t;if(t.dataset.t==='capture'&&!S.s2.ev)S.s2.ev='congress';paint()},
 mic:()=>{const w=S.wi;if(w.mic){clearInterval(S._mic);w.mic=false;paint();return}
   w.mic=true;w.notes='';paint();const words=DEMO_NOTE.split(' ');let i=0;const ta=()=>$('#notes');
   S._mic=setInterval(()=>{if(i>=words.length){clearInterval(S._mic);w.mic=false;paint();return}w.notes=words.slice(0,++i).join(' ');const t=ta();if(t){t.value=w.notes;t.scrollTop=t.scrollHeight}},110)},
 extract:async()=>{const w=S.wi;if(!w.notes||w.busy)return;w.busy=true;paint();await sleep(1100);w.busy=false;
   const r=aiExtract(w.notes);const chips=[];let n=0;
   [['first','First name'],['last','Last name'],['email','Email'],['spec','Specialty'],['city','City'],['org','Hospital']].forEach(([k,l])=>{if(r[k]){w[k]=r[k];n++;chips.push(l+': '+r[k])}});
   if(r.interest){w.interest=r.interest;chips.push('Interest: '+r.interest);n++}
   w.task=r.task||{title:'Follow up with Dr. '+(r.last||''),due:'Within 2 weeks'};if(r.task)n++;
   w.ai={n,chips};w.flash=true;paint();const pb=$('.pbody');if(pb)pb.scrollTo({top:pb.scrollHeight,behavior:'smooth'})},
 rsave:()=>{const w=S.wi;if(!w.first||!w.last){w._err=true;paint();toast('First and last name are required');return}
   newCap({first:w.first,last:w.last,email:w.email||'',spec:w.spec||'',city:w.city||'',org:w.org||'',channel:'rep',by:REP,event:S.s2.ev||'congress',notes:w.notes||'',interest:w.interest||'',task:w.ai?w.task:null,optIn:'pending'});
   S.wi={};S.s2.screen='captures';paint();toast('Capture saved'+(w.ai?' · follow-up task created':''))},
 s2go:t=>{const k=t.dataset.k,s=S.s2;clearInterval(S._mic);S.wi.mic=false;if(!s.ev)s.ev='congress';
   if(k==='events'){s.screen='events'}
   else if(k==='search'){s.screen='capture';s.q='';s.sel=null}
   else if(k==='found'){s.screen='capture';s.q='Ferri';s.sel='H1'}
   else if(k==='walk'){S.wi={last:'Bianchi'};s.screen='walkin'}
   else if(k==='ai'){const r=aiExtract(DEMO_NOTE);S.wi={first:r.first,last:r.last,email:r.email,spec:r.spec,city:r.city,org:r.org,notes:DEMO_NOTE,interest:r.interest,task:r.task,flash:true,ai:{n:7,chips:['First name: '+r.first,'Last name: '+r.last,'Email: '+r.email,'Specialty: '+r.spec,'City: '+r.city,'Hospital: '+r.org,'Interest: '+r.interest,'Follow-up: Nov 2026']}};s.screen='walkin'}
   else s.screen='captures';paint()},
 rerun:()=>{if(S.s4.running)return;if(S.caps.every(c=>c.processed))S.caps.forEach(c=>c.processed=false);paint();runMatching()},
 /* review */
 r5tab:t=>{S.s5.tab=t.dataset.t;paint()},r5list:()=>{S.s5.view='list';paint()},
 r5open:t=>{S.s5.view='rec';S.s5.cur=t.dataset.id;S.s5.sel=null;paint()},
 r5pick:t=>{S.s5.sel=t.dataset.id;paint()},
 r5do:t=>{const c=S.caps.find(x=>x.id===S.s5.cur);const type=t.dataset.t;const sl=S.s5.sel||c.out.cands[0].h.id;
   c.res={type,hcp:type==='matched'?sl:null,hm:fakeNow()};if(type!=='discarded')S.s6.cur=c.id;
   paint();toast(type==='matched'?'Matched – consent record created':type==='created'?'New HCP created – consent record created':'Capture discarded')},
 s6pick:t=>{S.s6.cur=t.value;paint()},replay:()=>replay(),
 s7ev:t=>{S.s7.ev=t.value;paint()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||t.type==='radio'&&e.type==='click'&&false)return;const f=A[t.dataset.a];if(f){if(t.tagName==='INPUT'&&t.type==='radio'){S._keepScroll=1}f(t,e)}});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.a){A[t.dataset.a](t)}});
function onIn(e){const t=e.target;if(!t.dataset||!t.dataset.in)return;const v=t.type==='checkbox'?t.checked:t.value;set(t.dataset.in,v);
  const p=t.dataset.prog;if(p&&S[p]){const n=progOf(p);const b=$(`[data-pg="${p}"]`),l=$(`[data-pt="${p}"]`);if(b)b.style.width=(n/6*100)+'%';if(l)l.textContent=n+' of 6 done'}
  if(t.id==='notes'){const b=$('[data-a="extract"]');if(b)b.disabled=!v}}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
document.addEventListener('input',e=>{if(e.target.id==='rq'){S.s2.q=e.target.value;S.s2.sel=null;$('#rres').innerHTML=repResults()}});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(S.step+1);if(e.key==='ArrowLeft')go(S.step-1)});
go(0);
</script>
</body>
</html>
